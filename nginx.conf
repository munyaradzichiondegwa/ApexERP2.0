server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Blazor _framework hashed files correctly
    location /_framework/ {
        root /usr/share/nginx/html;
        default_type application/octet-stream;
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri /index.html;
    }

    # Optional: API proxy (if your backend is on another service)
    location /api/ {
        proxy_pass http://backend:5000; # change to your backend URL
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: caching for static files
    location ~* \.(js|css|wasm|woff2?|eot|ttf|svg|png|jpg|jpeg|gif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}